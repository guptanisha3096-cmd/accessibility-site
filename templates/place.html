{% extends "base.html" %}
{% block content %}
<h2>{{ place.name }}</h2>
<p><strong>{{ place.category }}</strong> — {{ place.area }}</p>
<p>{{ place.description }}</p>

<h3>Facilities</h3>
<ul>
{% for f in facilities %}
    <li>{{ f.facility_type }}: {{ f.available }}</li>
{% endfor %}
</ul>

<h3>Reviews</h3>
<form method="POST" action="/review/{{ place.id }}">
    <input type="text" name="user_name" placeholder="Your name" required>
    <input type="number" name="rating" min="1" max="5" value="5" required>
    <textarea name="comment" placeholder="Write a review..." required></textarea>
    <button type="submit">Submit Review</button>
</form>
<ul>
</ul>

<h3>Report a Problem</h3>
<form method="POST" action="/place/{{ place.id }}/report">
    <textarea name="problem" placeholder="Describe the problem (e.g. broken ramp)..." required></textarea>
    <button type="submit">Submit Report</button>
</form>

<a href="/">Back to home</a>
{% endblock %}
